<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="TSC 勤怠">
  <defs>
    <!-- アプリのブランド色（emerald）。左上を明るくして立体感を出す -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10B981"/>
      <stop offset="0.55" stop-color="#059669"/>
      <stop offset="1" stop-color="#046A54"/>
    </linearGradient>
    <!-- 文字盤をわずかに沈ませる内側の影 -->
    <radialGradient id="dial" cx="0.5" cy="0.42" r="0.72">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.06"/>
    </radialGradient>
  </defs>

  <!-- 背景（全面。角丸はOS側のマスクに任せる） -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- 時計。マスカブル安全域（中央80%）に収まる直径に設定 -->
  <g transform="translate(256 256)">
    <circle r="150" fill="url(#dial)"/>
    <circle r="150" fill="none" stroke="#ffffff" stroke-width="26"/>

    <!-- 12・3・6・9 の目盛り -->
    <g stroke="#ffffff" stroke-width="15" stroke-linecap="round" opacity="0.92">
      <line x1="0" y1="-108" x2="0" y2="-84"/>
      <line x1="108" y1="0" x2="84" y2="0"/>
      <line x1="0" y1="108" x2="0" y2="84"/>
      <line x1="-108" y1="0" x2="-84" y2="0"/>
    </g>

    <!-- 針は 8:30（区分①の始業時刻）を指す。分針は6時の目盛りと重ならない長さにする -->
    <line x1="0" y1="0" x2="-40" y2="-55" stroke="#ffffff" stroke-width="26" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="0" y2="72" stroke="#ffffff" stroke-width="19" stroke-linecap="round"/>
    <circle r="15" fill="#ffffff"/>
  </g>
</svg>
